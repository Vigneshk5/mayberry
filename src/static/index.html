<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokoro TTS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.5;
            padding: 1.5rem;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: #fff;
            font-weight: 500;
        }

        .upload-section {
            background: #252525;
            border: 1px dashed #444;
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .upload-section.dragover {
            border-color: #4a9eff;
            background: #1e2a3a;
        }

        .upload-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-section label.file-label {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #4a9eff;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }

        .upload-section label.file-label:hover {
            background: #3a8eef;
        }

        .voice-select {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .voice-select label {
            font-size: 12px;
            color: #888;
        }

        .voice-select select {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 0.4rem 0.6rem;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
        }

        .voice-select select:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .upload-hint {
            margin-top: 0.75rem;
            color: #666;
            font-size: 11px;
        }

        .jobs-section h2 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #fff;
            font-weight: 500;
        }

        .job-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .job-card {
            background: #252525;
            border: 1px solid #333;
            border-radius: 6px;
            overflow: hidden;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: #2a2a2a;
            border-bottom: 1px solid #333;
        }

        .job-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .job-filename {
            font-weight: 500;
            color: #fff;
            font-size: 13px;
        }

        .job-voice {
            font-size: 11px;
            color: #888;
            background: #333;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
        }

        .job-status {
            font-size: 11px;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .job-status.pending {
            background: #333;
            color: #888;
        }

        .job-status.processing {
            background: #3a3520;
            color: #f0c040;
        }

        .job-status.completed {
            background: #1a3a1a;
            color: #4ade80;
        }

        .job-status.failed {
            background: #3a1a1a;
            color: #f87171;
        }

        .job-body {
            padding: 1rem;
        }

        .job-info {
            display: flex;
            gap: 2rem;
            margin-bottom: 0.75rem;
            font-size: 12px;
            color: #888;
        }

        .progress-container {
            margin-bottom: 0.75rem;
        }

        .progress-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4a9eff;
            transition: width 0.3s ease;
        }

        .progress-fill.completed {
            background: #4ade80;
        }

        .progress-fill.failed {
            background: #f87171;
        }

        .progress-text {
            font-size: 11px;
            color: #888;
            margin-top: 0.35rem;
            display: flex;
            justify-content: space-between;
        }

        .job-logs {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 0.5rem;
            max-height: 150px;
            overflow-y: auto;
            font-family: "SF Mono", "Monaco", "Consolas", monospace;
            font-size: 11px;
            margin-bottom: 0.75rem;
        }

        .log-entry {
            padding: 0.15rem 0;
            display: flex;
            gap: 0.5rem;
        }

        .log-time {
            color: #666;
            flex-shrink: 0;
        }

        .log-msg {
            color: #aaa;
            word-break: break-all;
        }

        .job-actions {
            display: flex;
            gap: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #333;
        }

        .btn {
            padding: 0.4rem 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
        }

        .btn-primary {
            background: #4a9eff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #3a8eef;
        }

        .btn-primary:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .job-error {
            color: #f87171;
            font-size: 12px;
            padding: 0.5rem;
            background: #2a1a1a;
            border-radius: 4px;
            margin-bottom: 0.75rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .text-preview {
            font-size: 11px;
            color: #666;
            padding: 0.5rem;
            background: #1e1e1e;
            border-radius: 4px;
            margin-bottom: 0.75rem;
            max-height: 60px;
            overflow: hidden;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kokoro TTS</h1>

        <div class="upload-section" id="dropzone">
            <div class="upload-controls">
                <input type="file" id="fileInput" accept=".txt,.pdf,.docx,.md" multiple>
                <label class="file-label" for="fileInput">Select Files</label>
                
                <div class="voice-select">
                    <label for="voiceSelect">Voice:</label>
                    <select id="voiceSelect">
                        <optgroup label="American Female">
                            <option value="af_heart" selected>Heart</option>
                            <option value="af_bella">Bella</option>
                            <option value="af_nicole">Nicole</option>
                            <option value="af_sarah">Sarah</option>
                            <option value="af_sky">Sky</option>
                        </optgroup>
                        <optgroup label="American Male">
                            <option value="am_adam">Adam</option>
                            <option value="am_michael">Michael</option>
                        </optgroup>
                        <optgroup label="British Female">
                            <option value="bf_emma">Emma</option>
                            <option value="bf_isabella">Isabella</option>
                        </optgroup>
                        <optgroup label="British Male">
                            <option value="bm_george">George</option>
                            <option value="bm_lewis">Lewis</option>
                        </optgroup>
                    </select>
                </div>
            </div>
            <p class="upload-hint">Drag and drop or select files (TXT, PDF, DOCX, MD)</p>
        </div>

        <div class="jobs-section">
            <h2>Jobs</h2>
            <div class="job-list" id="jobList">
                <div class="empty-state">No jobs. Upload a document to start.</div>
            </div>
        </div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const voiceSelect = document.getElementById('voiceSelect');
        const jobList = document.getElementById('jobList');

        let pollingInterval = null;

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            files.forEach(file => uploadFile(file));
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => uploadFile(file));
            e.target.value = '';
        });

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('voice', voiceSelect.value);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert('Upload failed: ' + (error.detail || 'Unknown error'));
                    return;
                }

                refreshJobs();
                startPolling();
            } catch (err) {
                alert('Upload failed: ' + err.message);
            }
        }

        async function refreshJobs() {
            try {
                const response = await fetch('/api/jobs');
                const jobs = await response.json();
                renderJobs(jobs);

                const hasActive = jobs.some(j => j.status === 'pending' || j.status === 'processing');
                if (!hasActive && pollingInterval) {
                    stopPolling();
                }
            } catch (err) {
                console.error('Failed to fetch jobs:', err);
            }
        }

        function renderJobs(jobs) {
            if (jobs.length === 0) {
                jobList.innerHTML = '<div class="empty-state">No jobs. Upload a document to start.</div>';
                return;
            }

            jobList.innerHTML = jobs.map(job => {
                const progressClass = job.status === 'completed' ? 'completed' : 
                                     job.status === 'failed' ? 'failed' : '';
                
                const segmentInfo = job.total_segments > 0 
                    ? `${job.current_segment}/${job.total_segments}` 
                    : '';

                const logsHtml = job.logs && job.logs.length > 0
                    ? job.logs.map(log => `
                        <div class="log-entry">
                            <span class="log-time">[${log.time}]</span>
                            <span class="log-msg">${escapeHtml(log.msg)}</span>
                        </div>
                    `).join('')
                    : '<div class="log-entry"><span class="log-msg">waiting...</span></div>';

                return `
                <div class="job-card" data-job-id="${job.id}">
                    <div class="job-header">
                        <div class="job-title">
                            <span class="job-filename">${escapeHtml(job.filename)}</span>
                            <span class="job-voice">${escapeHtml(job.voice || 'af_heart')}</span>
                        </div>
                        <span class="job-status ${job.status}">${job.status}</span>
                    </div>
                    <div class="job-body">
                        ${job.text_preview ? `<div class="text-preview">"${escapeHtml(job.text_preview)}"</div>` : ''}
                        
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill ${progressClass}" style="width: ${job.progress}%"></div>
                            </div>
                            <div class="progress-text">
                                <span>${job.progress}% ${job.message}</span>
                                <span>${segmentInfo}</span>
                            </div>
                        </div>

                        <div class="job-logs">${logsHtml}</div>

                        ${job.error ? `<div class="job-error">${escapeHtml(job.error)}</div>` : ''}
                        
                        <div class="job-actions">
                            <button class="btn btn-primary" 
                                    onclick="downloadAudio('${job.id}')"
                                    ${job.status !== 'completed' ? 'disabled' : ''}>
                                Download
                            </button>
                            <button class="btn btn-danger" onclick="deleteJob('${job.id}')">
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');

            document.querySelectorAll('.job-logs').forEach(el => {
                el.scrollTop = el.scrollHeight;
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function downloadAudio(jobId) {
            window.location.href = `/api/jobs/${jobId}/download`;
        }

        async function deleteJob(jobId) {
            if (!confirm('Delete this job?')) return;

            try {
                await fetch(`/api/jobs/${jobId}`, { method: 'DELETE' });
                refreshJobs();
            } catch (err) {
                alert('Failed to delete job: ' + err.message);
            }
        }

        function startPolling() {
            if (pollingInterval) return;
            pollingInterval = setInterval(refreshJobs, 500);
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        refreshJobs();
    </script>
</body>
</html>
