<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayberry</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #111; color: #e0e0e0; line-height: 1.5;
  padding: 1rem; font-size: 14px;
}
.container { max-width: 920px; margin: 0 auto; }

header {
  display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;
  padding-bottom: 0.75rem; border-bottom: 1px solid #222;
}
header h1 { font-size: 1.15rem; font-weight: 600; color: #fff; }
header .badge { font-size: 10px; color: #888; background: #222; padding: 0.15rem 0.5rem; border-radius: 3px; }

.stats-bar {
  display: flex; gap: 1.5rem; margin-bottom: 1rem; font-size: 11px; color: #777;
}
.stats-bar span.active { color: #f0c040; }
.stats-bar span.done { color: #4ade80; }

.tabs {
  display: flex; gap: 0; margin-bottom: 0;
}
.tab {
  padding: 0.5rem 1rem; background: #1a1a1a; border: 1px solid #222; border-bottom: none;
  border-radius: 6px 6px 0 0; cursor: pointer; font-size: 12px; color: #888; margin-right: -1px;
}
.tab.active { background: #222; color: #fff; border-color: #333; }

.panel {
  background: #222; border: 1px solid #333; border-radius: 0 0 6px 6px;
  padding: 1.25rem; margin-bottom: 1.25rem;
}

.panel.hidden { display: none; }

textarea {
  width: 100%; height: 180px; background: #161616; border: 1px solid #333;
  color: #e0e0e0; border-radius: 5px; padding: 0.75rem; font-family: inherit;
  font-size: 13px; resize: vertical; line-height: 1.6;
}
textarea:focus { outline: none; border-color: #4a9eff; }
.char-count { text-align: right; font-size: 11px; color: #555; margin-top: 0.3rem; }

.upload-zone {
  border: 1px dashed #444; border-radius: 6px; padding: 2rem; text-align: center;
  cursor: pointer; transition: background 0.15s, border-color 0.15s;
}
.upload-zone:hover, .upload-zone.dragover { border-color: #4a9eff; background: #1a2230; }
.upload-zone input[type="file"] { display: none; }
.upload-zone-icon { font-size: 1.5rem; margin-bottom: 0.5rem; opacity: 0.4; }
.upload-zone p { font-size: 12px; color: #666; }

.controls {
  display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;
  margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #2a2a2a;
}

.control-group { display: flex; flex-direction: column; gap: 0.3rem; }
.control-group label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }

select {
  background: #161616; color: #e0e0e0; border: 1px solid #333;
  border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 12px; font-family: inherit; cursor: pointer;
}
select:focus { outline: none; border-color: #4a9eff; }

.speed-slider { display: flex; align-items: center; gap: 0.5rem; }
.speed-slider input[type="range"] {
  -webkit-appearance: none; width: 100px; height: 4px;
  background: #333; border-radius: 2px; outline: none;
}
.speed-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  background: #4a9eff; border-radius: 50%; cursor: pointer;
}
.speed-value { font-size: 12px; color: #4a9eff; width: 30px; text-align: center; }

.btn {
  padding: 0.45rem 1rem; border: none; border-radius: 5px; cursor: pointer;
  font-size: 12px; font-weight: 600; font-family: inherit; letter-spacing: 0.3px;
  transition: opacity 0.15s;
}
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: #4a9eff; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #3a8eef; }
.btn-danger { background: #8b3a3a; color: #fff; }
.btn-danger:hover:not(:disabled) { background: #a03333; }

.jobs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.jobs-header h2 { font-size: 1rem; color: #fff; font-weight: 500; }
.jobs-header .btn { font-size: 10px; padding: 0.3rem 0.6rem; }

.job-list { display: flex; flex-direction: column; gap: 0.75rem; }

.job-card {
  background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px;
  overflow: hidden; transition: border-color 0.2s;
}
.job-card.completed { border-color: #1a3a1a; }
.job-card.failed { border-color: #3a1a1a; }
.job-card.processing { border-color: #2a2510; }

.job-top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.6rem 0.8rem; background: #1e1e1e; border-bottom: 1px solid #2a2a2a;
}
.job-top-left { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
.job-name {
  font-size: 12px; font-weight: 500; color: #ddd;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px;
}
.job-badge {
  font-size: 10px; padding: 0.12rem 0.4rem; border-radius: 3px;
  background: #2a2a2a; color: #888;
}
.job-badge.voice { color: #aaa; background: #1e2a3a; }
.job-status-badge {
  font-size: 10px; padding: 0.2rem 0.5rem; border-radius: 3px;
  text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;
}
.job-status-badge.pending { background: #2a2a2a; color: #888; }
.job-status-badge.processing { background: #251f10; color: #f0c040; }
.job-status-badge.completed { background: #0f1f0f; color: #4ade80; }
.job-status-badge.failed { background: #2a1010; color: #f87171; }

.job-body { padding: 0.6rem 0.8rem; }

.progress-wrap { margin-bottom: 0.5rem; }
.progress-bar { height: 4px; background: #2a2a2a; border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: #4a9eff; transition: width 0.3s; }
.progress-fill.done { background: #4ade80; }
.progress-fail { background: #f87171; }
.progress-info { display: flex; justify-content: space-between; font-size: 10px; color: #666; margin-top: 0.25rem; }

.job-audio { margin-bottom: 0.5rem; }
.job-audio audio { width: 100%; height: 28px; border-radius: 4px; }
time { font-size: 10px; color: #555; }

.job-text {
  font-size: 11px; color: #555; padding: 0.4rem 0.5rem;
  background: #121212; border-radius: 4px; margin-bottom: 0.5rem;
  max-height: 48px; overflow: hidden; font-style: italic; white-space: pre-wrap;
}

.log-panel {
  background: #0d0d0d; border: 1px solid #222; border-radius: 4px;
  padding: 0.4rem; max-height: 120px; overflow-y: auto;
  font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 10px; margin-bottom: 0.5rem;
}
.log-line { display: flex; gap: 0.4rem; padding: 0.1rem 0; }
.log-time { color: #444; flex-shrink: 0; }
.log-msg { color: #777; word-break: break-all; }

.job-error {
  color: #f87171; font-size: 11px; padding: 0.4rem 0.5rem;
  background: #1a0f0f; border-radius: 4px; margin-bottom: 0.5rem;
}

.job-actions { display: flex; gap: 0.4rem; }
.job-actions .btn { font-size: 11px; padding: 0.3rem 0.6rem; }

.empty-state { text-align: center; padding: 2rem; color: #444; font-size: 13px; }

footer { text-align: center; padding: 1.5rem 0 0.5rem; font-size: 10px; color: #333; }
</style>
</head>
<body>
<div class="container">

<header>
  <a href="/" style="display:flex;align-items:center;gap:0.6rem;text-decoration:none;color:inherit">
    <img src="/logo.svg" alt="Mayberry logo" width="28" height="28" style="border-radius:6px;display:block" />
    <h1>Mayberry</h1>
  </a>
  <span class="badge">local</span>
</header>

<div class="stats-bar" id="statsBar"></div>

<div class="tabs">
  <div class="tab active" data-panel="uploadPanel">Upload Document</div>
  <div class="tab" data-panel="textPanel">Type Text</div>
</div>

<div class="panel" id="uploadPanel">
  <div class="upload-zone" id="dropzone">
    <input type="file" id="fileInput" accept=".txt,.pdf,.docx,.md" multiple>
    <div class="upload-zone-icon">&#128196;</div>
    <p>Drop files here or click to browse</p>
    <p style="font-size:10px;margin-top:0.3rem">TXT · PDF · DOCX · MD</p>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Voice</label>
      <select id="uploadVoice">
        <optgroup label="American Female">
          <option value="af_heart" selected>Heart</option>
          <option value="af_bella">Bella</option>
          <option value="af_nicole">Nicole</option>
          <option value="af_sarah">Sarah</option>
          <option value="af_sky">Sky</option>
        </optgroup>
        <optgroup label="American Male">
          <option value="am_adam">Adam</option>
          <option value="am_michael">Michael</option>
        </optgroup>
        <optgroup label="British Female">
          <option value="bf_emma">Emma</option>
          <option value="bf_isabella">Isabella</option>
        </optgroup>
        <optgroup label="British Male">
          <option value="bm_george">George</option>
          <option value="bm_lewis">Lewis</option>
        </optgroup>
      </select>
    </div>
    <div class="control-group">
      <label>Speed</label>
      <div class="speed-slider">
        <input type="range" id="uploadSpeed" min="0.5" max="2.0" step="0.05" value="1.0">
        <span class="speed-value" id="uploadSpeedVal">1.0</span>
      </div>
    </div>
  </div>
</div>

<div class="panel hidden" id="textPanel">
  <textarea id="textInput" placeholder="Type or paste text here..."></textarea>
  <div class="char-count"><span id="charCount">0</span> characters</div>

  <div class="controls">
    <div class="control-group">
      <label>Voice</label>
      <select id="textVoice">
        <optgroup label="American Female">
          <option value="af_heart" selected>Heart</option>
          <option value="af_bella">Bella</option>
          <option value="af_nicole">Nicole</option>
          <option value="af_sarah">Sarah</option>
          <option value="af_sky">Sky</option>
        </optgroup>
        <optgroup label="American Male">
          <option value="am_adam">Adam</option>
          <option value="am_michael">Michael</option>
        </optgroup>
        <optgroup label="British Female">
          <option value="bf_emma">Emma</option>
          <option value="bf_isabella">Isabella</option>
        </optgroup>
        <optgroup label="British Male">
          <option value="bm_george">George</option>
          <option value="bm_lewis">Lewis</option>
        </optgroup>
      </select>
    </div>
    <div class="control-group">
      <label>Speed</label>
      <div class="speed-slider">
        <input type="range" id="textSpeed" min="0.5" max="2.0" step="0.05" value="1.0">
        <span class="speed-value" id="textSpeedVal">1.0</span>
      </div>
    </div>
    <button class="btn btn-primary" id="synthesizeBtn">Synthesize</button>
  </div>
</div>

<div class="jobs-header">
  <h2>Jobs</h2>
  <button class="btn btn-danger" id="clearAllBtn" onclick="clearCompleted()">Clear Done</button>
</div>
<div class="job-list" id="jobList">
  <div class="empty-state">No jobs yet. Upload a document or type text to start.</div>
</div>

<footer>Kokoro-82M · Apple Silicon</footer>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const textInput = document.getElementById('textInput');
const synthesizeBtn = document.getElementById('synthesizeBtn');
const jobList = document.getElementById('jobList');
const statsBar = document.getElementById('statsBar');

const uploadVoice = document.getElementById('uploadVoice');
const uploadSpeed = document.getElementById('uploadSpeed');
const uploadSpeedVal = document.getElementById('uploadSpeedVal');
const textVoice = document.getElementById('textVoice');
const textSpeed = document.getElementById('textSpeed');
const textSpeedVal = document.getElementById('textSpeedVal');

let pollingTimer = null;

uploadSpeed.oninput = () => uploadSpeedVal.textContent = parseFloat(uploadSpeed.value).toFixed(2);
textSpeed.oninput = () => textSpeedVal.textContent = parseFloat(textSpeed.value).toFixed(2);
textInput.oninput = () => document.getElementById('charCount').textContent = textInput.value.length;

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('uploadPanel').classList.add('hidden');
    document.getElementById('textPanel').classList.add('hidden');
    document.getElementById(tab.dataset.panel).classList.remove('hidden');
  };
});

// Drag & drop
dropzone.onclick = () => fileInput.click();
dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('dragover'); };
dropzone.ondragleave = () => dropzone.classList.remove('dragover');
dropzone.ondrop = e => {
  e.preventDefault(); dropzone.classList.remove('dragover');
  Array.from(e.dataTransfer.files).forEach(uploadFile);
};
fileInput.onchange = e => {
  Array.from(e.target.files).forEach(uploadFile);
  e.target.value = '';
};

// Synthesize text
synthesizeBtn.onclick = async () => {
  const text = textInput.value.trim();
  if (!text) return;
  synthesizeBtn.disabled = true;
  try {
    const r = await fetch('/api/synthesize', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        text, voice: textVoice.value,
        speed: parseFloat(textSpeed.value)
      })
    });
    if (!r.ok) { const e = await r.json(); alert(e.detail || 'Failed'); return; }
    textInput.value = '';
    document.getElementById('charCount').textContent = '0';
    refreshJobs();
    startPolling();
  } catch (err) { alert('Synthesize failed: ' + err.message); }
  finally { synthesizeBtn.disabled = false; }
};

// Upload file
async function uploadFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('voice', uploadVoice.value);
  fd.append('speed', uploadSpeed.value);
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    if (!r.ok) { const e = await r.json(); alert(e.detail || 'Upload failed'); return; }
    refreshJobs();
    startPolling();
  } catch (err) { alert('Upload failed: ' + err.message); }
}

// Keyboard shortcut
document.onkeydown = e => {
  if (e.metaKey && e.key === 'Enter') { e.preventDefault(); synthesizeBtn.click(); }
};

// Polling
async function refreshJobs() {
  try {
    const jobs = await (await fetch('/api/jobs')).json();
    renderJobs(jobs);
    const active = jobs.filter(j => j.status === 'pending' || j.status === 'processing');
    const done = jobs.filter(j => j.status === 'completed');
    statsBar.innerHTML =
      `<span>${jobs.length} jobs</span>` +
      (active.length ? `<span class="active">${active.length} active</span>` : '') +
      (done.length ? `<span class="done">${done.length} done</span>` : '');
    if (!active.length && pollingTimer) stopPolling();
  } catch (err) { console.error(err); }
}

function renderJobs(jobs) {
  if (!jobs.length) {
    jobList.innerHTML = '<div class="empty-state">No jobs yet. Upload a document or type text to start.</div>';
    return;
  }
  jobList.innerHTML = jobs.map(j => {
    const pCls = j.status === 'completed' ? 'done' : j.status === 'failed' ? 'progress-fail' : '';
    const cardCls = j.status === 'completed' ? 'completed' : j.status === 'failed' ? 'failed' : j.status === 'processing' ? 'processing' : '';
    const seg = j.total_segments ? `${j.current_segment}/${j.total_segments}` : '';

    const audio = (j.status === 'completed' && j.has_audio)
      ? `<div class="job-audio"><audio controls src="/api/jobs/${j.id}/download"></audio></div>`
      : '';

    const dur = j.duration_sec ? `<time>${fmtDuration(j.duration_sec)}</time>` : '';

    const logs = (j.logs && j.logs.length)
      ? j.logs.map(l => `<div class="log-line"><span class="log-time">${l.time}</span><span class="log-msg">${esc(l.msg)}</span></div>`).join('')
      : '<div class="log-line"><span class="log-msg">waiting…</span></div>';

    const ago = timeAgo(j.created_at);

    return `<div class="job-card ${cardCls}" data-id="${j.id}">
      <div class="job-top">
        <div class="job-top-left">
          <span class="job-name" title="${esc(j.filename)}">${esc(j.filename)}</span>
          <span class="job-badge voice">${esc(j.voice)}</span>
          ${j.speed !== 1 ? `<span class="job-badge">${j.speed.toFixed(2)}x</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <span style="font-size:10px;color:#555">${ago}</span>
          <span class="job-status-badge ${j.status}">${j.status}</span>
        </div>
      </div>
      <div class="job-body">
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill ${pCls}" style="width:${j.progress}%"></div>
          </div>
          <div class="progress-info">
            <span>${j.progress}% ${j.message || ''}</span>
            <span>${seg}</span>
          </div>
        </div>
        ${audio}
        ${dur}
        <div class="log-panel">${logs}</div>
        ${j.error ? `<div class="job-error">${esc(j.error)}</div>` : ''}
        <div class="job-actions">
          <button class="btn btn-primary" onclick="downloadAudio('${j.id}')" ${j.status !== 'completed' ? 'disabled' : ''}>Download</button>
          <button class="btn btn-danger" onclick="deleteJob('${j.id}')">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.log-panel').forEach(el => el.scrollTop = el.scrollHeight);
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function fmtDuration(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return m ? `${m}m ${s}s` : `${s}s`;
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 10) return 'just now';
  if (diff < 60) return `${Math.floor(diff)}s ago`;
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  return `${Math.floor(diff / 3600)}h ago`;
}

function downloadAudio(id) { window.location.href = `/api/jobs/${id}/download`; }

async function deleteJob(id) {
  if (!confirm('Delete this job?')) return;
  try { await fetch(`/api/jobs/${id}`, { method: 'DELETE' }); refreshJobs(); }
  catch (err) { alert('Failed: ' + err.message); }
}

async function clearCompleted() {
  if (!confirm('Remove all completed and failed jobs?')) return;
  try {
    const jobs = await (await fetch('/api/jobs')).json();
    await Promise.all(jobs.filter(j => j.status === 'completed' || j.status === 'failed').map(j =>
      fetch(`/api/jobs/${j.id}`, { method: 'DELETE' })
    ));
    refreshJobs();
  } catch (err) { alert('Failed: ' + err.message); }
}

function startPolling() {
  if (pollingTimer) return;
  pollingTimer = setInterval(refreshJobs, 500);
}

function stopPolling() {
  if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
}

refreshJobs();
</script>
</body>
</html>
