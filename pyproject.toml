[project]
name = "mayberry"
version = "0.1.0"
description = "Local, private text-to-speech server powered by Kokoro-82M — hardware-accelerated for Apple Silicon and NVIDIA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mayberry Contributors" }]
maintainers = [{ name = "Mayberry Contributors" }]
keywords = ["tts", "text-to-speech", "kokoro", "fastapi", "apple-silicon", "mps", "cuda"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Intended Audience :: Developers",
    "Environment :: Web Environment",
]
dependencies = [
    "kokoro>=0.9.4",
    "soundfile",
    "numpy",
    "misaki[en]",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pypdf",
    "python-docx",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/Vigneshk5/mayberry"
Repository = "https://github.com/Vigneshk5/mayberry"
Issues = "https://github.com/Vigneshk5/mayberry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]
