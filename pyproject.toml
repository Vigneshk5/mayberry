[project]
name = "mayberry"
version = "0.1.0"
description = "Kokoro-82M TTS with Apple Silicon MPS acceleration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kokoro>=0.9.4",
    "soundfile",
    "numpy",
    "misaki[en]",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pypdf",
    "python-docx",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
